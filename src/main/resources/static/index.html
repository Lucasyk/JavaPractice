<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Lucas Koga API</title>

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 24px;
                font-family: Arial, sans-serif;
                color: #f8fafc;
                background:
                    radial-gradient(
                        circle at top,
                        #4338ca 0%,
                        transparent 45%
                    ),
                    #0f172a;
            }

            main {
                width: min(600px, 100%);
                padding: 48px;
                text-align: center;
                background: rgba(30, 41, 59, 0.8);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 24px;
                box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
            }

            h1 {
                margin-top: 0;
                font-size: clamp(2rem, 7vw, 3.5rem);
            }

            p {
                color: #cbd5e1;
                line-height: 1.7;
            }

            .status {
                display: inline-block;
                margin-top: 16px;
                padding: 10px 18px;
                color: #86efac;
                background: rgba(34, 197, 94, 0.12);
                border: 1px solid rgba(134, 239, 172, 0.3);
                border-radius: 999px;
            }
        </style>
    </head>

    <body>
        <main>
            <h1>Lucas Koga API</h1>

            <p>
                Welcome! This server provides the backend API for my language
                learning application.
            </p>

            <div class="status">● API is running</div>
        </main>
    </body>
</html>
