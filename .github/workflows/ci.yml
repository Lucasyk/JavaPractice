name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew clean test --no-daemon

      - name: Build Docker image
        run: docker build -t demo-app:ci .

      - name: Log in to Github Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with: 
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Push Docker image to GHCR
        if: github.event_name == 'push'
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker tag demo-app:ci "$IMAGE:latest"
          docker tag demo-app:ci "$IMAGE:${GITHUB_SHA}"

          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy to EC2
        if: github.event_name == 'push'
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy JavaPractice" \
            --parameters 'commands=[
              "cd /home/ubuntu/demo-backend",
              "docker compose -f docker-compose.prod.yml pull",
              "docker compose -f docker-compose.prod.yml up -d"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

      - name: Verify deployment health
        if: github.event_name == 'push'
        shell: bash
        run: |
          for i in {1..12}; do
            echo "Health check attempt $i..."

            if curl --fail --silent \
              https://api.lucaskoga.com/actuator/health \
              | grep -q '"status":"UP"'; then

              echo "Deployment is healthy!"
              exit 0
            fi

            sleep 5
          done

          echo "Deployment health check failed."
          exit 1