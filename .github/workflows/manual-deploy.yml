name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy selected image
        shell: bash
        run: |
          IMAGE_TAG="${{ inputs.image_tag }}"

          PARAMS=$(jq -nc \
            --arg tag "$IMAGE_TAG" \
            '{
              commands: [
                "cd /home/ubuntu/demo-backend",
                ("sed -i \"s/^IMAGE_TAG=.*/IMAGE_TAG=" + $tag + "/\" .env"),
                "docker compose -f docker-compose.prod.yml pull app",
                "docker compose -f docker-compose.prod.yml up -d app"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Manual deploy $IMAGE_TAG" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"; then

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --output json || true

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --output json

      - name: Verify deployment health
        shell: bash
        run: |
          for i in {1..12}; do
            echo "Health check attempt $i..."

            if curl --fail --silent \
              https://api.lucaskoga.com/actuator/health \
              | grep -q '"status":"UP"'; then

              echo "Deployment is healthy!"
              exit 0
            fi

            sleep 5
          done

          echo "Deployment health check failed."
          exit 1